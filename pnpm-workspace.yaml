# Supply chain. A release must be 3 days old before an install may pick it (minutes).
minimumReleaseAge: 4320
# Fail when a package's publish trust dropped against its earlier releases.
trustPolicy: no-downgrade
# Only the root may depend on git or tarball URLs.
blockExoticSubdeps: true
# Install scripts run only for the packages listed here; any other one fails the install.
strictDepBuilds: true
allowBuilds:
  esbuild: true
  # Spike: cbor-x's optional native accelerator (via @workflow/world-postgres). It falls back to JS; not run.
  cbor-extract: false
# Spike (docs/eve-spike.md): eve 1.3.0 is the version its docs describe and is under 3 days old.
# Exact-pinned in package.json; remove this line when the spike is dropped or the release matures.
minimumReleaseAgeExclude:
  - eve
# Spike: graphile-worker (via @workflow/world-postgres) pulls @types/node@22, whose undici-types@6.21.0 trips
# trustPolicy. It is a types-only package; point it at the version the repo already uses instead of
# widening trustPolicy.
overrides:
  undici-types: 7.24.6
