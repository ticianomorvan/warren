packages:
  - apps/*
  - packages/*

# Supply chain. A release must be 3 days old before an install may pick it (minutes).
minimumReleaseAge: 4320
minimumReleaseAgeExclude:
  - "@vercel/functions@3.11.3"
# Fail when a package's publish trust dropped against its earlier releases. These exact
# versions already tripped it when the policy was added; new versions are not exempt.
trustPolicy: no-downgrade
trustPolicyExclude:
  - "@vercel/cli-config@0.3.1"
  - "@vercel/cli-config@0.4.0"
  - "@vercel/cli-exec@1.0.1"
  - "@vercel/functions@3.11.3"
  - "@vercel/oidc@3.8.10"
  - "@vercel/oidc@4.0.9"
# Only the root may depend on git or tarball URLs.
blockExoticSubdeps: true
# Install scripts run only for the packages listed here; any other one fails the install.
strictDepBuilds: true
allowBuilds:
  esbuild: true
